<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

    <h1 class="auth-title">Student Registration</h1>

    <form id="registerForm">

        <div class="auth-box">

            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" placeholder="Enter Full Name" required>
            <small id="nameError" class="error"></small>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email" required>
            <small id="emailError" class="error"></small>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="Enter 10 digit mobile number" maxlength="10" required>
            <small id="mobileError" class="error"></small>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Create Password" required>
            <small id="passwordStrength"></small>
            <small id="passwordError" class="error"></small>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <small id="confirmPasswordError" class="error"></small>

            <label for="course">Course:</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
            </select>
            <small id="courseError" class="error"></small>

            <label for="year">Year:</label>
            <select id="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
            <small id="yearError" class="error"></small>

            <label>Gender:</label>

            <div>
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <small id="genderError" class="error"></small>

            <label>
                <input type="checkbox" id="terms">
                I accept the Terms and Conditions
            </label>

            <small id="termsError" class="error"></small>

            <button type="submit" class="registerbtn">
                Register
            </button>

            <p id="successMessage" class="success"></p>

            <a class="login" href="login.html">
                Already have an account? Login
            </a>

        </div>

    </form>

    <script src="script.js"></script>

</body>
</html>
