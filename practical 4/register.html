<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

 <h1 class="auth-title">Register</h1>
<form action="login.html" id="registerForm">
<div class="auth-box">
<label>Full Name:</label>
<input placeholder="Enter Full Name" required="" type="text"/>
<br/><br/>
<label>Username:</label>
<input placeholder="Create Username" required="" type="text"/>
<br/><br/>
<label>Email:</label>
<input placeholder="Enter Email" required="" type="email"/>
<br/><br/>
<label>Password:</label>
<input id="password" placeholder="Create Password" required="" type="password"/>
<br/><br/>
<label>Confirm Password:</label>
<input id="confirmPassword" placeholder="Confirm Password" required="" type="password"/>
<br/><br/>
<input class="registerbtn" type="submit" value="Register" align="center"/>
<a class="login" href="login.html"><br/>Already have an account? Login</a>
</div>
</form>


<script src="script.js"></script>
</body>
</html>
